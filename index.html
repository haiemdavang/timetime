<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time</title>
    <link rel="icon" type="image/png" href="public/logoo.png">
    <meta name="description"
        content="Một ứng dụng hiển thị thời gian tối giản với hiệu ứng trượt số và font digital cổ điển.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="popup_alarm.style.css">
    <link rel="stylesheet" href="history.style.css">
    <link rel="stylesheet" href="popup_setting.style.css">
    <link rel="stylesheet" href="weather/popup_weather.style.css">
    <link rel="stylesheet" href="weather/popup_detail.style.css">
    <link rel="stylesheet" href="weather/popup_search.style.css">
</head>

<body>
    <video id="bg-video" autoplay loop muted playsinline
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; display: none;"></video>
    <div class="main-wrapper">
        <div class="countdown-container">
            <!-- Cat Sprite Styles -->
            <div id="cat-container">
                <div class="cat-sprite" id="cat-sprite"></div>
            </div>
            <!-- Clock Display Area (Templates will load here) -->
            <div id="clock-display" style="display: contents;"></div>
        </div>

        <!-- History Alarms -->
        <div class="history-container">
            <div class="history-list" id="history-list">
                <!-- Sẽ được thêm bằng JS -->
            </div>
        </div>
    </div>

    <!-- Floating Menu -->
    <div class="floating-menu-container" id="floating-menu">
        <div class="fab-options">
            <button class="fab-action" id="open-setting-modal">Settings</button>
            <button class="fab-action" id="open-alarm-panel">Set Alarm</button>
        </div>
        <button class="settings-btn main-fab">
            +
        </button>
    </div>

    <!-- Setting Modal is loaded dynamically via popup_setting.html -->

    <!-- Side Panel -->
    <div class="side-panel" id="side-panel">
        <button class="close-panel" id="close-settings">×</button>
        <h2>Set Alarm</h2>

        <div class="input-group">
            <label>Alarm Time (24h)</label>
            <div class="time-input-container">
                <input type="number" id="alarm-h" placeholder="HH" min="0" max="23" value="08">
                <span>:</span>
                <input type="number" id="alarm-m" placeholder="MM" min="0" max="59" value="00">
                <span>:</span>
                <input type="number" id="alarm-s" placeholder="SS" min="0" max="59" value="00">
            </div>
        </div>

        <div class="input-group">
            <label for="alarm-msg">Reminder Message</label>
            <input type="text" id="alarm-msg" placeholder="Coffee time?">
        </div>

        <button class="set-alarm-btn" id="set-alarm">Save Alarm</button>
    </div>

    <!-- Alarm Notice (Professional Toast) -->
    <div class="alarm-notice" id="alarm-notice">
        <div class="notice-content">
            <button class="close-notice" id="dismiss-alarm">×</button>
            <div class="notice-main">
                <div class="alarm-icon-small">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,20A7,7 0 0,1 5,13A7,7 0 0,1 12,6A7,7 0 0,1 19,13A7,7 0 0,1 12,20M12,4A9,9 0 0,0 3,13A9,9 0 0,0 12,22A9,9 0 0,0 21,13A9,9 0 0,0 12,4M12.5,8H11V14L15.75,16.85L16.5,15.62L12.5,13.25V8M7.88,3.39L6.6,1.86L2,5.71L3.29,7.24L7.88,3.39M22,5.72L17.4,1.86L16.11,3.39L20.71,7.25L22,5.72Z">
                        </path>
                    </svg>
                </div>
                <h2 id="notice-msg">Hết giờ rồi!</h2>
            </div>
        </div>
    </div>



    <div class="copyright"
        style="position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 0.4rem; color: rgba(255, 255, 255, 0.2); z-index: 10;">
        © haiemdavang
    </div>

    <audio id="alarm-audio" src="public/iphone.mp3" preload="auto"></audio>

    <script src="cat.script.js"></script>
    <script src="history.script.js"></script>
    <script src="popup_alarm.script.js"></script>
    <script src="popup_setting.script.js"></script>
    <script src="script.js"></script>
    <script src="weather/popup_weather.script.js"></script>
    <script src="weather/popup_detail.script.js"></script>
    <script src="weather/popup_search.script.js"></script>
</body>

</html>
