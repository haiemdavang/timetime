<div id="weather-search-modal" class="weather-search-modal">
    <div class="weather-search-content">
        <button class="weather-search-close" id="weather-search-close">&times;</button>
        <div class="weather-search-header">
            <h3>Tìm kiếm địa điểm</h3>
        </div>
        <div class="weather-search-input-wrapper">
            <input type="text" id="weather-search-input" placeholder="Nhập tên xã, huyện, tỉnh..." autocomplete="off">
            <div id="weather-search-spinner" class="weather-search-spinner hidden"></div>
        </div>
        <div class="weather-search-results" id="weather-search-results">
            <!-- Search results will appear here -->
            <div class="search-hint">Hãy nhập ít nhất 2 ký tự...</div>
        </div>
    </div>
</div>
