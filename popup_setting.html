<div class="setting-modal" id="setting-modal">
    <div class="setting-modal-header">
        <h2>Settings</h2>
        <button class="close-modal-btn" id="close-setting-modal">×</button>
    </div>
    <div class="setting-item">
        <label>Show History Timeline</label>
        <label class="toggle-switch">
            <input type="checkbox" id="toggle-history" checked>
            <span class="slider"></span>
        </label>
    </div>
    <div class="setting-item">
        <label>Show Cat</label>
        <label class="toggle-switch">
            <input type="checkbox" id="toggle-cat" checked>
            <span class="slider"></span>
        </label>
    </div>
    <div class="setting-item">
        <label>Show Weather</label>
        <label class="toggle-switch">
            <input type="checkbox" id="toggle-weather" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
        <label>Theme Background</label>
        <div class="bg-options">
            <div class="bg-dot active" style="background: #000000;" data-bg="#000000"></div>
            <div class="bg-dot" style="background: #0f172a;" data-bg="#0f172a"></div>
            <div class="bg-dot" style="background: #1c1917;" data-bg="#1c1917"></div>
            <div class="bg-dot" style="background: #172554;" data-bg="#172554"></div>
            <!-- <div class="bg-dot bg-video-preset" style="background-image: url('public/0.png'); background-size: cover; background-position: center;" data-video="https://res.cloudinary.com/ddgzxh32d/video/upload/v1776783206/0_h7crjl.mp4"></div>
            <div class="bg-dot bg-video-preset" style="background-image: url('public/1.png'); background-size: cover; background-position: center;" data-video="https://res.cloudinary.com/ddgzxh32d/video/upload/v1776783573/1_hnfirb.mp4"></div>
            <div class="bg-dot bg-video-preset" style="background-image: url('public/2.png'); background-size: cover; background-position: center;" data-video="https://res.cloudinary.com/ddgzxh32d/video/upload/v1776783759/2_apxqck.mp4"></div>
            <div class="bg-dot bg-video-preset" style="background-image: url('public/3.png'); background-size: cover; background-position: center;" data-video="https://res.cloudinary.com/ddgzxh32d/video/upload/v1776783216/3_gvtqoc.mp4"></div>

                +
                <input type="file" id="bg-upload" accept="image/*,video/*" hidden>
            </label>
        </div>
    </div>
</div>
